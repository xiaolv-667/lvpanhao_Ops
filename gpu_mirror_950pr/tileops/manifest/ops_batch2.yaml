MLADenseBwdOp:
  family: attention
  status: implemented
  ref_api: flash_attn_interface._flash_attn_backward
  signature:
    forall:
      B: Dim
      S_q: Dim
      S_kv: Dim
      H: Dim
      D_qk: Dim
      D_v: Dim
      T: DType[float16 | bfloat16]
    params:
      is_causal:
        type: bool
        default: false
      sm_scale:
        type: float | None
        default: null
    inputs:
      do:
        dtype: T
        shape: '[B, S_q, H, D_v]'
      q:
        dtype: T
        shape: '[B, S_q, H, D_qk]'
      k:
        dtype: T
        shape: '[B, S_kv, H, D_qk]'
      v:
        dtype: T
        shape: '[B, S_kv, H, D_v]'
      o:
        dtype: T
        shape: '[B, S_q, H, D_v]'
      lse:
        dtype: float32
        shape: '[B, H, S_q]'
    outputs:
      dq:
        dtype: T
        shape: '[B, S_q, H, D_qk]'
      dk:
        dtype: T
        shape: '[B, S_kv, H, D_qk]'
      dv:
        dtype: T
        shape: '[B, S_kv, H, D_v]'
    shape_rules:
    - S_kv > 0
    - not present(sm_scale) or 0 < sm_scale < inf
  workloads:
  - is_causal: true
    B: 1
    S_q: 4096
    S_kv: 4096
    H: 128
    D_qk: 192
    D_v: 128
    dtype_cases:
    - T: bfloat16
    - T: float16
    label: ds-v3-4k
  - is_causal: true
    B: 2
    S_q: 8192
    S_kv: 8192
    H: 128
    D_qk: 192
    D_v: 128
    dtype_cases:
    - T: bfloat16
    label: ds-v3-b2-8k
  - is_causal: true
    B: 1
    S_q: 8192
    S_kv: 8192
    H: 64
    D_qk: 192
    D_v: 128
    dtype_cases:
    - T: bfloat16
    label: kimi-k2-8k
  - is_causal: true
    B: 4
    S_q: 3072
    S_kv: 3072
    H: 16
    D_qk: 192
    D_v: 128
    dtype_cases:
    - T: bfloat16
    label: ds-v2-lite-3k
  roofline:
    func: tileops._perf.formulas.mla_dense_bwd_roofline
  source:
    kernel: tileops/_kernels/attention/mla/bwd.py
    kernel_map:
      dense_bwd: MLADenseBwdKernel
    op: tileops/_ops/attention/mla.py
    test: tests/ops/test_mla_bwd.py
    bench: benchmarks/ops/bench_mla.py
    bench_manifest_driven: true
MLAVarlenBwdOp:
  family: attention
  status: implemented
  ref_api: flash_attn_interface._flash_attn_backward
  signature:
    forall:
      B: Dim
      T_q: Dim
      T_kv: Dim
      H: Dim
      D_qk: Dim
      D_v: Dim
      T: DType[float16 | bfloat16]
      q_lens: Seq[Int]
      kv_lens: Seq[Int]
    params:
      is_causal:
        type: bool
        default: false
      sm_scale:
        type: float | None
        default: null
      validate_inputs:
        type: bool
        default: false
        kw_only: true
    inputs:
      do:
        dtype: T
        shape: '[T_q, H, D_v]'
      q:
        dtype: T
        shape: '[T_q, H, D_qk]'
      k:
        dtype: T
        shape: '[T_kv, H, D_qk]'
      v:
        dtype: T
        shape: '[T_kv, H, D_v]'
      o:
        dtype: T
        shape: '[T_q, H, D_v]'
      lse:
        dtype: float32
        shape: '[H, T_q]'
      cu_seqlens_q:
        dtype: int32
        shape: '[B + 1]'
        values: prefix_sum(q_lens)
        requires:
        - prefix_offsets(T_q)
      cu_seqlens_kv:
        dtype: int32
        shape: '[B + 1]'
        values: prefix_sum(kv_lens)
        requires:
        - prefix_offsets(T_kv)
    outputs:
      dq:
        dtype: T
        shape: '[T_q, H, D_qk]'
      dk:
        dtype: T
        shape: '[T_kv, H, D_qk]'
      dv:
        dtype: T
        shape: '[T_kv, H, D_v]'
    shape_rules:
    - not present(sm_scale) or 0 < sm_scale < inf
  workloads:
  - is_causal: true
    T_q: 32768
    T_kv: 32768
    H: 128
    D_qk: 192
    D_v: 128
    q_lens: repeat(4096, 8)
    kv_lens: repeat(4096, 8)
    dtype_cases:
    - T: bfloat16
    - T: float16
    label: ds-v3-8x4k
  - is_causal: true
    T_q: 32256
    T_kv: 32256
    H: 128
    D_qk: 192
    D_v: 128
    q_lens:
    - 512
    - 1024
    - 2048
    - 4096
    - 8192
    - 16384
    kv_lens:
    - 512
    - 1024
    - 2048
    - 4096
    - 8192
    - 16384
    dtype_cases:
    - T: bfloat16
    label: ds-v3-mixed
  - is_causal: true
    T_q: 32768
    T_kv: 32768
    H: 64
    D_qk: 192
    D_v: 128
    q_lens: repeat(8192, 4)
    kv_lens: repeat(8192, 4)
    dtype_cases:
    - T: bfloat16
    label: kimi-k2-4x8k
  roofline:
    func: tileops._perf.formulas.mla_varlen_bwd_roofline
  source:
    kernel: tileops/_kernels/attention/mla/bwd.py
    kernel_map:
      varlen_bwd: MLAVarlenBwdKernel
    op: tileops/_ops/attention/mla.py
    test: tests/ops/test_mla_bwd.py
    bench: benchmarks/ops/bench_mla.py
    bench_manifest_driven: true
MoEPermuteAlignFwdOp:
  family: moe
  status: implemented
  ref_api: vllm._custom_ops.moe_align_block_size
  signature:
    forall:
      T: Dim
      K: Dim
    params:
      num_experts:
        type: int
      block_size:
        type: int
        default: 64
    inputs:
      topk_ids:
        dtype: int32
        shape: '[T, K]'
        values: topk_ids(T, K, num_experts)
        requires:
        - in_range(0, num_experts)
    let:
      P: T * K + (num_experts + 1) * (block_size - 1)
    outputs:
      sorted_token_ids:
        dtype: int32
        shape: '[P]'
      expert_ids:
        dtype: int32
        shape: '[ceil_div(P, block_size)]'
      num_tokens_post_pad:
        dtype: int32
        shape: '[1]'
    shape_rules:
    - num_experts > 0
    - block_size > 0
  workloads:
