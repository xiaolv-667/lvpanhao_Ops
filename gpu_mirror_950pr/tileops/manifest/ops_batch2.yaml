ChainSpeculativeSamplingFwdOp:
  family: sampling
  status: implemented
  ref_api: flashinfer.sampling.chain_speculative_sampling
  signature:
    forall:
      B: Dim
      N: Dim
      V: Dim
    inputs:
      draft_probs:
        dtype: float32
        shape: '[B, N, V]'
      draft_token_ids:
        dtype: int32
        shape: '[B, N]'
        values: random_ints((B, N), 0, V)
        requires:
        - in_range(0, V)
      target_probs:
        dtype: float32
        shape: '[B, N + 1, V]'
      seed:
        dtype: int64
        shape: '[1]'
      offset:
        dtype: int64
        shape: '[1]'
    outputs:
      output_token_ids:
        dtype: int32
        shape: '[B, N + 1]'
      num_accepted:
        dtype: int32
        shape: '[B]'
    shape_rules:
    - N > 0
  workloads:
  - B: 16
    N: 4
    V: 128256
    label: llama-8b-b16-n4
  - B: 64
    N: 4
    V: 128256
    label: llama-8b-b64-n4
  - B: 64
    N: 1
    V: 129280
    label: ds-v3-mtp-n1
  - B: 64
    N: 3
    V: 129280
    label: ds-v3-mtp-n3
  - B: 32
    N: 5
    V: 151936
    label: qwen3-235b-eagle-n5
  - B: 17
    N: 8
    V: 128256
    label: llama-8b-b17-n8
  - B: 256
    N: 1
    V: 32000
