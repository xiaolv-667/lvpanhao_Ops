SSDChunkCouplingFwdOp:
  family: mamba
  status: implemented
  ref_api: mamba_ssm.ops.triton.ssd_bmm._bmm_chunk_fwd
  signature:
    forall:
      Bsz: Dim
      S: Dim
      G: Dim
      N: Dim
      T: DType[float16 | bfloat16]
    params:
      chunk_size:
        type: int
    inputs:
      C:
        dtype: T
        shape: '[Bsz, S, G, N]'
      B:
        dtype: T
        shape: '[Bsz, S, G, N]'
    outputs:
      cb:
        dtype: T
        shape: '[Bsz, NC, G, chunk_size, chunk_size]'
    let:
      NC: S // chunk_size
