        dtype: T
        shape: '[*S, head_size * Hq]'
      key_out:
        dtype: T
        shape: '[*S, head_size * Hk]'
        nullable: present(key)
    shape_rules:
    - head_size > 0 and 0 < rotary_dim <= head_size and rotary_dim % 2 == 0
    - max_position_embeddings > 0 and base > 0
    - init_cache
