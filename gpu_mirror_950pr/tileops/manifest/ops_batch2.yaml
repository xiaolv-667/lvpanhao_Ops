  signature:
    forall:
      S: Shape
      Hq: Dim
      Hk: Dim
      T: DType[float16 | bfloat16 | float32]
      I: DType[int32 | int64]
    params:
      head_size:
        type: int
      rotary_dim:
        type: int
      max_position_embeddings:
        type: int
      base:
        type: float
      is_neox_style:
        type: bool
      dtype:
        type: float16 | bfloat16 | float32
      init_cache:
        type: bool
        default: true
      validate_inputs:
        type: bool
        default: false
        kw_only: true
    inputs:
      positions:
        dtype: I
        shape: '[*S]'
        values: random_ints(S, 0, max_position_embeddings)
        requires:
        - in_range(0, max_position_embeddings)
      query:
        dtype: T
        shape: '[*S, head_size * Hq]'
      key:
        type: Tensor | None
        dtype: T
        shape: '[*S, head_size * Hk]'
        default: null
